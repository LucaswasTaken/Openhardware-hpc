# Ambiente local (alternativa ao Colab):  conda env create -f environment.yml
# Com uv (mais rápido):                     uv venv && uv pip install -r requirements.txt
name: hpc-python-curso
channels:
  - conda-forge

dependencies:
  - python=3.12
  - numpy>=2.0,<2.5        # numba-cuda ainda não acompanha o NumPy 2.5
  - scipy>=1.13
  - matplotlib>=3.8
  - joblib>=1.4
  - numba>=0.61
  - threadpoolctl>=3.5
  - psutil>=6.0
  - line_profiler>=4.1
  - array-api-compat>=1.9
  - jupyterlab>=4.2
  - ipykernel
  - uv                     # usado na demonstração do Python sem GIL (3.14t)
  - pip
  - pip:
      # GPU NVIDIA (opcional): CuPy e Numba-CUDA com os cabeçalhos/compilador do CUDA 12 via pip
      - cupy-cuda12x[ctk]>=13.3
      - numba-cuda[cu12]>=0.10
